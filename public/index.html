<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c4dff">
<title>Pulse</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: phone-shaped single-screen social app — sticky top bar, swappable screens, fixed bottom tab bar, slide-in overlays for chat & profile detail. Dark-first premium, warm-to-cool gradient accent. */
  :root {
    --bg: #faf9fd;
    --surface: #ffffff;
    --surface-2: #f2f0f8;
    --line: #e6e3ef;
    --fg: #16131f;
    --muted: #6b6578;
    --faint: #9b94a8;
    --accent: #7c4dff;
    --accent-2: #ff4d8d;
    --accent-3: #18c2a8;
    --grad: linear-gradient(120deg, #7c4dff 0%, #ff4d8d 55%, #ff8a3d 100%);
    --grad-pink: linear-gradient(120deg, #ff4d8d, #ff8a3d);
    --good: #17b26a;
    --warn: #f79009;
    --shadow: 0 8px 30px rgba(42, 26, 74, 0.10);
    --shadow-lg: 0 18px 50px rgba(42, 26, 74, 0.18);
    --radius: 20px;
    --font-display: "Sora", system-ui, sans-serif;
    --font-body: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0b14; --surface: #16131f; --surface-2: #211c2e; --line: #2b2539;
      --fg: #f4f1fb; --muted: #a79fb8; --faint: #726a85;
      --accent: #9b7bff; --accent-2: #ff6ba3; --accent-3: #2ad4ba;
      --shadow: 0 10px 34px rgba(0,0,0,0.5); --shadow-lg: 0 20px 55px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0b14; --surface: #16131f; --surface-2: #211c2e; --line: #2b2539;
    --fg: #f4f1fb; --muted: #a79fb8; --faint: #726a85;
    --accent: #9b7bff; --accent-2: #ff6ba3; --accent-3: #2ad4ba;
    --shadow: 0 10px 34px rgba(0,0,0,0.5); --shadow-lg: 0 20px 55px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-body); -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 60; background: var(--surface);
  }
  .app {
    max-width: 480px; margin: 0 auto; height: 100%;
    display: flex; flex-direction: column; background: var(--bg); position: relative; overflow: hidden;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px max(16px, env(safe-area-inset-left,0px)) 12px max(16px, env(safe-area-inset-right,0px));
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(14px); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand .dot { width: 26px; height: 26px; border-radius: 9px; background: var(--grad); box-shadow: 0 3px 12px rgba(124,77,255,.45); position: relative; flex: none; }
  .brand .dot::after { content: ""; position: absolute; inset: 7px; border-radius: 4px; background: var(--surface); }
  .brand h1 { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .topbar .actions { display: flex; align-items: center; gap: 6px; }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: grid; place-items: center; cursor: pointer; transition: transform .15s, background .15s; position: relative; }
  .icon-btn:hover { background: var(--surface-2); transform: translateY(-1px); }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn .badge { position: absolute; transform: translate(11px,-11px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--accent-2); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }

  /* ---------- Screens ---------- */
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 0 max(16px, env(safe-area-inset-left,0px)) 92px max(16px, env(safe-area-inset-right,0px)); }
  .screen[hidden] { display: none; }
  .section-title { font-family: var(--font-display); font-weight: 600; margin: 18px 2px 10px; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: 0.08em; }

  /* ---------- Stories ---------- */
  .stories { display: flex; gap: 14px; overflow-x: auto; padding: 16px 2px 6px; scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story { flex: none; width: 64px; text-align: center; cursor: pointer; }
  .story .ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: var(--grad); display: grid; place-items: center; }
  .story .ring.seen { background: var(--line); }
  .story .ring.add { background: var(--surface-2); border: 2px dashed var(--line); padding: 0; }
  .story .av { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--surface); background: var(--surface-2); display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 20px; }
  .story .add-plus { font-size: 26px; color: var(--accent); font-weight: 300; }
  .story span { display: block; margin-top: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Post card ---------- */
  .post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .post-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
  .av-sm { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 16px; }
  .post-head .who { flex: 1; min-width: 0; }
  .post-head .name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 5px; }
  .tick { width: 14px; height: 14px; flex: none; }
  .post-head .meta { font-size: 12px; color: var(--faint); margin-top: 1px; }
  .post-text { font-size: 14.5px; line-height: 1.5; margin: 0 0 12px; }
  .post-text .tag { color: var(--accent); font-weight: 600; }
  .post-media { border-radius: 14px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 4/3; max-width: 100%; display: grid; place-items: center; position: relative; font-family: var(--font-display); color: #fff; font-weight: 600; font-size: 19px; text-align: center; padding: 20px; line-height: 1.3; }
  .post-actions { display: flex; align-items: center; gap: 4px; }
  .act { display: flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 11px; cursor: pointer; border: none; background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 13px; font-weight: 600; transition: background .15s, color .15s; }
  .act:hover { background: var(--surface-2); }
  .act svg { width: 19px; height: 19px; }
  .act.liked { color: var(--accent-2); }
  .act.liked svg { fill: var(--accent-2); animation: pop .35s; }
  .act.saved { color: var(--accent); }
  .act.saved svg { fill: var(--accent); }
  .act.spacer { margin-left: auto; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)} }

  /* ---------- Composer ---------- */
  .composer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 4px 0 14px; box-shadow: var(--shadow); }
  .composer .row { display: flex; gap: 11px; align-items: flex-start; }
  .composer textarea { flex: 1; min-width: 0; border: none; background: transparent; resize: none; font-family: var(--font-body); font-size: 15px; color: var(--fg); line-height: 1.5; min-height: 44px; outline: none; }
  .composer textarea::placeholder { color: var(--faint); }
  .composer .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .composer .chips { display: flex; gap: 6px; }
  .mini-chip { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--accent); }
  .mini-chip svg { width: 17px; height: 17px; }
  .btn-grad { border: none; cursor: pointer; color: #fff; font-weight: 700; font-size: 13.5px; font-family: var(--font-body); padding: 10px 20px; border-radius: 12px; background: var(--grad); box-shadow: 0 4px 14px rgba(124,77,255,.4); transition: transform .15s, box-shadow .15s; }
  .btn-grad:hover { transform: translateY(-1px); box-shadow: 0 7px 20px rgba(124,77,255,.5); }
  .btn-grad:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

  /* ---------- Search / chips row ---------- */
  .search { display: flex; align-items: center; gap: 9px; margin: 16px 0 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; }
  .search svg { width: 18px; height: 18px; color: var(--faint); flex: none; }
  .search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: var(--font-body); font-size: 14px; color: var(--fg); }
  .search input::placeholder { color: var(--faint); }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .fchip { flex: none; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .fchip.on { background: var(--grad); color: #fff; border-color: transparent; }

  /* ---------- Chat list ---------- */
  .chat-row { display: flex; align-items: center; gap: 13px; padding: 13px 10px; border-radius: 16px; cursor: pointer; transition: background .15s; }
  .chat-row:hover { background: var(--surface-2); }
  .chat-av { position: relative; flex: none; }
  .chat-av .online { position: absolute; right: 0; bottom: 0; width: 13px; height: 13px; border-radius: 50%; background: var(--good); border: 2.5px solid var(--surface); }
  .chat-row .body { flex: 1; min-width: 0; }
  .chat-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .chat-row .nm { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 5px; }
  .chat-row .tm { font-size: 11.5px; color: var(--faint); flex: none; }
  .chat-row .prev { font-size: 13px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row .prev.unread { color: var(--fg); font-weight: 600; }
  .chat-row .unread-dot { flex: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--grad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .ai-pill { font-size: 9px; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; background: var(--surface-2); color: var(--accent-3); border: 1px solid var(--line); }

  /* ---------- Discover / swipe ---------- */
  .deck-wrap { position: relative; height: 62vh; max-height: 560px; min-height: 420px; margin: 18px 0 8px; }
  .swipe-card {
    position: absolute; inset: 0; border-radius: 26px; overflow: hidden; box-shadow: var(--shadow-lg);
    color: #fff; display: flex; flex-direction: column; justify-content: flex-end;
    cursor: grab; user-select: none; touch-action: pan-y;
    will-change: transform;
  }
  .swipe-card:active { cursor: grabbing; }
  .swipe-card .scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(0,0,0,.72) 100%); }
  .swipe-card .avatar-big { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 48px; background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.5); backdrop-filter: blur(4px); }
  .swipe-card .info { position: relative; padding: 22px; z-index: 2; }
  .swipe-card .info h3 { font-family: var(--font-display); font-size: 25px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em; }
  .swipe-card .info .sub { font-size: 14px; opacity: .92; margin-bottom: 10px; }
  .swipe-card .info .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .swipe-card .info .tags span { font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 20px; background: rgba(255,255,255,.22); backdrop-filter: blur(4px); }
  .swipe-card .dist { position: absolute; top: 20px; right: 18px; font-size: 11.5px; font-weight: 700; padding: 6px 12px; border-radius: 20px; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); z-index: 2; }
  .stamp { position: absolute; top: 44px; font-family: var(--font-display); font-weight: 800; font-size: 34px; padding: 6px 16px; border-radius: 12px; border: 4px solid; opacity: 0; z-index: 3; text-transform: uppercase; }
  .stamp.like { left: 22px; color: var(--good); border-color: var(--good); transform: rotate(-16deg); }
  .stamp.nope { right: 22px; color: var(--accent-2); border-color: var(--accent-2); transform: rotate(16deg); }
  .deck-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 30px; }
  .deck-empty svg { width: 54px; height: 54px; color: var(--accent); margin-bottom: 12px; }
  .swipe-controls { display: flex; justify-content: center; gap: 18px; margin-top: 6px; }
  .sbtn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s; }
  .sbtn:hover { transform: translateY(-3px) scale(1.05); }
  .sbtn svg { width: 26px; height: 26px; }
  .sbtn.nope svg { color: var(--accent-2); }
  .sbtn.star { width: 50px; height: 50px; }
  .sbtn.star svg { color: var(--accent); width: 22px; }
  .sbtn.like svg { color: var(--good); }

  /* match popup */
  .match-pop { position: absolute; inset: 0; z-index: 80; background: rgba(13,11,20,.82); backdrop-filter: blur(6px); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; color: #fff; }
  .match-pop.show { display: flex; animation: fade .3s; }
  @keyframes fade { from{opacity:0} to{opacity:1} }
  .match-pop h2 { font-family: var(--font-display); font-size: 40px; margin: 0 0 6px; background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .match-pop p { opacity: .85; margin: 0 0 22px; }
  .match-avs { display: flex; gap: -10px; margin-bottom: 20px; }
  .match-avs .av-sm { width: 90px; height: 90px; font-size: 34px; border: 4px solid rgba(255,255,255,.25); }
  .match-avs .av-sm:last-child { margin-left: -24px; }

  /* ---------- Nearby opt-in ---------- */
  .optin { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 20px; text-align: center; box-shadow: var(--shadow); margin-top: 22px; }
  .optin .halo { width: 76px; height: 76px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(124,77,255,.4); }
  .optin .halo svg { width: 36px; height: 36px; color: #fff; }
  .optin h3 { font-family: var(--font-display); font-size: 20px; margin: 0 0 8px; }
  .optin p { font-size: 13.5px; color: var(--muted); line-height: 1.55; max-width: 44ch; margin: 0 auto 10px; }
  .optin .consent { font-size: 12px; color: var(--faint); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin: 14px 0; line-height: 1.5; text-align: left; }
  .optin .consent b { color: var(--accent-3); }
  .nearby-row { display: flex; align-items: center; gap: 13px; padding: 13px 10px; border-radius: 16px; transition: background .15s; }
  .nearby-row:hover { background: var(--surface-2); }
  .nearby-row .body { flex: 1; min-width: 0; }
  .nearby-row .nm { font-weight: 700; font-size: 14.5px; }
  .nearby-row .meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .nearby-row .wave { flex: none; border: none; background: var(--surface-2); border: 1px solid var(--line); color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 8px 14px; border-radius: 20px; cursor: pointer; }
  .nearby-banner { font-size: 12px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; margin: 14px 0 4px; display: flex; align-items: center; gap: 9px; }
  .nearby-banner svg { width: 16px; height: 16px; color: var(--accent-3); flex: none; }
  .nearby-banner button { margin-left: auto; border: none; background: transparent; color: var(--accent); font-weight: 700; font-size: 12px; cursor: pointer; flex: none; }

  /* ---------- Conversation ---------- */
  .convo { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; z-index: 50; transform: translateX(100%); transition: transform .28s cubic-bezier(.3,.8,.3,1); }
  .convo.open { transform: translateX(0); }
  .convo-head { display: flex; align-items: center; gap: 11px; padding: 12px max(14px,env(safe-area-inset-left,0px)) 12px max(10px,env(safe-area-inset-right,0px)); padding-top: calc(12px + env(safe-area-inset-top,0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
  .convo-head .back { width: 36px; height: 36px; flex: none; border: none; background: transparent; color: var(--fg); display: grid; place-items: center; cursor: pointer; border-radius: 10px; }
  .convo-head .back:hover { background: var(--surface-2); }
  .convo-head .nm { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .convo-head .st { font-size: 12px; color: var(--accent-3); margin-top: 1px; }
  .convo-body { flex: 1; overflow-y: auto; padding: 18px max(16px,env(safe-area-inset-left,0px)); display: flex; flex-direction: column; gap: 9px; }
  .ai-note { text-align: center; font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin: 0 auto 8px; max-width: 90%; line-height: 1.5; }
  .day-sep { text-align: center; font-size: 11px; color: var(--faint); margin: 6px 0; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.45; position: relative; word-wrap: break-word; }
  .bubble .t { display: block; font-size: 10px; margin-top: 4px; opacity: .65; text-align: right; }
  .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--grad); color: #fff; border-bottom-right-radius: 6px; }
  .typing { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; border-bottom-left-radius: 6px; padding: 12px 16px; display: flex; gap: 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay: .2s; } .typing i:nth-child(3){ animation-delay: .4s; }
  @keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }
  .convo-input { display: flex; align-items: center; gap: 9px; padding: 12px max(16px,env(safe-area-inset-left,0px)); padding-bottom: calc(12px + env(safe-area-inset-bottom,0px)); border-top: 1px solid var(--line); background: var(--surface); }
  .convo-input input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 22px; padding: 11px 16px; outline: none; font-family: var(--font-body); font-size: 14.5px; color: var(--fg); }
  .send-btn { width: 44px; height: 44px; flex: none; border-radius: 50%; border: none; background: var(--grad); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 14px rgba(124,77,255,.4); transition: transform .15s; }
  .send-btn:hover { transform: scale(1.06); }
  .send-btn svg { width: 20px; height: 20px; }

  /* ---------- Profile detail overlay (matrimony style) ---------- */
  .pdetail { position: absolute; inset: 0; background: var(--bg); z-index: 52; transform: translateX(100%); transition: transform .28s cubic-bezier(.3,.8,.3,1); overflow-y: auto; padding-bottom: 100px; }
  .pdetail.open { transform: translateX(0); }
  .pd-cover { height: 220px; position: relative; display: grid; place-items: center; }
  .pd-cover .av { width: 120px; height: 120px; border-radius: 36px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 52px; color: #fff; background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.5); }

<div class="app">
  <header class="topbar">

    <div id="feed"></div>
  </main>

  <main class="screen" id="screen-discover" hidden>

      <button class="sbtn like" id="btnLike" aria-label="Like"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.3-9.3-8.5C.9 9.4 2.4 6 5.6 6c1.9 0 3.2 1.1 4.4 2.5C11.2 7.1 12.5 6 14.4 6c3.2 0 4.7 3.4 2.9 6.5C19 16.7 12 21 12 21Z"/></svg></button>
    </div>

        <div class="lbl">Location sharing<div class="desc">ON hone par hi aap Nearby me dikhoge</div></div>

  </nav>

</div>
