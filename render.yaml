services:
  - type: web
    name: pulse
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: starter            # SQLite ke liye disk chahiye, free plan me disk nahi milti
    disk:
      name: pulse-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_FILE
        value: /var/data/pulse.db
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false          # optional: Saathi ko asli AI banane ke liye
