<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#ec1f6e"/>
      <stop offset="1" stop-color="#ff8a3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <!-- two clean rings forming an infinity loop (unlimited connections) -->
  <circle cx="186" cy="256" r="84" fill="none" stroke="#ffffff" stroke-width="30"/>
  <circle cx="326" cy="256" r="84" fill="none" stroke="#ffffff" stroke-width="30"/>
  <!-- a heartbeat pulse line threading through the waist, giving the mark its name -->
  <path d="M 100 256 L 150 256 L 172 198 L 212 318 L 240 256 L 272 256 L 300 198 L 340 318 L 362 256 L 412 256"
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
        opacity="0" />
  <!-- mask out the pulse crossing so rings read clean; instead place pulse only across the central gap -->
  <rect x="236" y="226" width="40" height="60" fill="url(#bg)"/>
  <path d="M 206 256 L 232 256 L 244 222 L 268 290 L 280 256 L 306 256"
        fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
